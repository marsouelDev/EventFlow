<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Event App — Gestion d'évènements</title>
  <link rel="stylesheet" href="/styles/Inscription.css" />
</head>
<body>
<header class="header">
 
  <div class="logo">
    <img src="/images/EventFlow.jpg" alt="Logo EventFlow" class="logo-img">
    <span>EventFlow</span>
  </div>

  <div id="theme">
    <button type="button">
      <img id="image" src="/images/icone-lune.jpg" alt="Changer le thème">
    </button>
  </div>
</header>

<h2>Inscription à un évènement</h2>

<form id="registration-form" class="formulaire">

  <div class="corps">
    <label for="reg-event">Évènement <span class="required">*</span></label>
    <select id="reg-event" name="reg-event">
      <option value="CONFERENCE">Conférence</option>
      <option value="SPORT">Sport</option>
      <option value="ATELIER">Atelier</option>
      <option value="AUTRE">Autre</option>
    </select>
  </div>

  <div class="corps">
    <label for="user-name">Nom de l'évènement <span class="required">*</span></label>
    <input id="user-name" name="user-name" type="text" placeholder="Nom de l'évènement"/>
  </div>

  <div class="corps">
    <label for="user-nameEtudiant">Nom complet <span class="required">*</span></label>
    <input id="user-nameEtudiant" name="user-nameEtudiant" type="text" placeholder="Nom de l'étudiant"/>
  </div>

  <div class="corps">
    <label for="user-email">Email institutionnel <span class="required">*</span></label>
    <input id="user-email" name="user-email" type="email" placeholder="ex: prenom.nom@saintjeaningenier.org"/>
  </div>

  <div class="BoutonEnresgistion">
    <button type="submit">S'inscrire</button>
    <a href="/gestion.html" class="annuler">Quitter</a>
  </div>

</form>

<script type="module" src="/dist/Event-management/gestionInscription.js"></script>
</body>
</html>
